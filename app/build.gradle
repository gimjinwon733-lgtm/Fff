plugins { id 'com.android.application' }
android {
    namespace 'com.example.minesautoplay'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.minesautoplay'
        minSdk 30
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
